      <line x1="155" y1="118" x2="155" y2="110"/>
      <line x1="135" y1="158" x2="135" y2="166"/>
      <line x1="145" y1="158" x2="145" y2="166"/>
      <line x1="155" y1="158" x2="155" y2="166"/>
      <line x1="125" y1="128" x2="117" y2="128"/>
      <line x1="125" y1="138" x2="117" y2="138"/>
      <line x1="125" y1="148" x2="117" y2="148"/>
      <line x1="165" y1="128" x2="173" y2="128"/>
      <line x1="165" y1="138" x2="173" y2="138"/>
      <line x1="165" y1="148" x2="173" y2="148"/>
