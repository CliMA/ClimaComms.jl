    <line x1="100" y1="58" x2="55" y2="138"/>
    <line x1="100" y1="58" x2="145" y2="138"/>
    <line x1="55" y1="138" x2="145" y2="138"/>
  </g>

  <!-- Data packets in transit -->
  <g fill="#FFFFFF" stroke="#4063D8" stroke-width="3">
    <circle cx="81.1" cy="91.6" r="6"/>
    <circle cx="126.1" cy="104.4" r="6"/>
    <circle cx="105" cy="138" r="6"/>
  </g>

  <!-- Green chip (top) -->
  <g>
    <g stroke="#389826" stroke-width="4" stroke-linecap="round">
      <line x1="90" y1="38" x2="90" y2="30"/>
      <line x1="100" y1="38" x2="100" y2="30"/>
      <line x1="110" y1="38" x2="110" y2="30"/>
      <line x1="90" y1="78" x2="90" y2="86"/>
      <line x1="100" y1="78" x2="100" y2="86"/>
      <line x1="110" y1="78" x2="110" y2="86"/>
      <line x1="80" y1="48" x2="72" y2="48"/>
      <line x1="80" y1="58" x2="72" y2="58"/>
      <line x1="80" y1="68" x2="72" y2="68"/>
      <line x1="120" y1="48" x2="128" y2="48"/>
      <line x1="120" y1="58" x2="128" y2="58"/>
      <line x1="120" y1="68" x2="128" y2="68"/>
