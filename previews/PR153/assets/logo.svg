    <rect x="91" y="49" width="18" height="18" rx="4" fill="none" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <!-- Red chip (bottom left) -->
  <g>
    <g stroke="#CB3C33" stroke-width="4" stroke-linecap="round">
      <line x1="45" y1="118" x2="45" y2="110"/>
      <line x1="55" y1="118" x2="55" y2="110"/>
      <line x1="65" y1="118" x2="65" y2="110"/>
      <line x1="45" y1="158" x2="45" y2="166"/>
      <line x1="55" y1="158" x2="55" y2="166"/>
      <line x1="65" y1="158" x2="65" y2="166"/>
      <line x1="35" y1="128" x2="27" y2="128"/>
      <line x1="35" y1="138" x2="27" y2="138"/>
      <line x1="35" y1="148" x2="27" y2="148"/>
      <line x1="75" y1="128" x2="83" y2="128"/>
      <line x1="75" y1="138" x2="83" y2="138"/>
      <line x1="75" y1="148" x2="83" y2="148"/>
